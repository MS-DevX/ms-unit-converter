name: Database Verification

# Validates content files and infrastructure on every PR and push.
# In Phase 2, this workflow will also regenerate and verify the committed DB binary.

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**']
    paths:
      - 'lib/data/**'
      - 'lib/database/**'
      - 'lib/repositories/**'
      - 'assets/data/**'
      - 'tools/**'
      - 'content/**'
      - 'pubspec.yaml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'lib/data/**'
      - 'lib/database/**'
      - 'lib/repositories/**'
      - 'assets/data/**'
      - 'tools/**'
      - 'content/**'
      - 'pubspec.yaml'

jobs:
  validate-content:
    name: Validate Content & Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run content linter
        run: dart run tools/lint_content.dart

      - name: Validate content files
        run: dart run tools/validate_content.dart

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

